name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      # elixir_account depends on OpenZeppelin stellar-accounts, whose workspace
      # enables the soroban-sdk feature 'experimental_spec_shaking_v2'. That
      # feature refuses to build under plain `cargo build` and requires
      # `stellar contract build` from stellar-cli v25.2.0+. Not our setting —
      # crates without the OZ dependency still build fine with cargo.
      - name: install stellar-cli
        uses: stellar/stellar-cli@v25.2.0

      # Wasm first: the factory tests include_bytes! the real sub-account Wasm
      # and deploy it by hash, and clippy --all-targets compiles those tests.
      - name: build wasm
        run: stellar contract build
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all

      # Publish hashes so anyone can verify deployed Wasm matches audited source.
      # docs/GAPS.md D.
      - name: wasm size + hashes
        run: |
          for f in target/wasm32v1-none/release/*.wasm; do
            printf '%s  %8s bytes  %s\n' \
              "$(sha256sum "$f" | cut -c1-16)" "$(stat -c%s "$f")" "$(basename "$f")"
          done
