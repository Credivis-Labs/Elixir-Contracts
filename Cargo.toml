[workspace]
resolver = "2"
members = [
    "contracts/elixir_account",
    "contracts/elixir_subaccount",
    "contracts/elixir_factory",
    "contracts/elixir_queue",
    "contracts/policies/destination_allowlist",
    "contracts/policies/timelock",
    "packages/elixir_types",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Credivis-Labs/Elixir-Contracts"

[workspace.dependencies]
soroban-sdk = "27.0.6"
elixir_types = { path = "packages/elixir_types" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Reproducible builds: see docs/GAPS.md D. Publish hashes so anyone can verify
# the deployed Wasm matches audited source.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
