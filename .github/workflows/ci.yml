name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check
      # Wasm first: the factory tests include_bytes! the real sub-account Wasm
      # and deploy it by hash, and clippy --all-targets compiles those tests.
      - name: build wasm
        run: cargo build --target wasm32v1-none --release
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all

      # Publish hashes so anyone can verify deployed Wasm matches audited source.
      # docs/GAPS.md D.
      - name: wasm size + hashes
        run: |
          for f in target/wasm32v1-none/release/*.wasm; do
            printf '%s  %8s bytes  %s\n' \
              "$(sha256sum "$f" | cut -c1-16)" "$(stat -c%s "$f")" "$(basename "$f")"
          done
